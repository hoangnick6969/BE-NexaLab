  performance: 'Root cause of slow API: Prisma engine with pgbouncer=true costs ~5 round trips per query (select 1 ~350 ms vs ~70 ms TCP RTT). src/db now uses @prisma/adapter-pg with verified TLS (bundled Supabase Root 2021 CA, sha256 80:70:25:AD:...:CA:FA): select 1 71 ms, 250-op concurrent benchmark 11.8 s → 4.6 s, student endpoints 4-6x faster (/auth/me 839 → 166 ms, /labs 2642 → ~600 ms, /me/progress 1904 → 443 ms). GET /labs batched: 48 → 9 queries per request, output identical (student 11 Labs, admin 13). Next: teacher GET /lessons returns 2 MB because LessonDetail (FE) finds one lesson in the full list; add GET /lessons/:id and slim the list.'
