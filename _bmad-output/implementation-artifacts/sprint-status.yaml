      - 'POST classes/:id/assignments/:aid/deadline-revisions {dueAt, expectedRevision, note?, submissionId?}: ACTIVE only, stale revision -> 409 DEADLINE_REVISION_STALE, dueAt must be later than now and current -> 400 DUE_DATE_NOT_LATER; writes revision n+1, mirrors Assignment.dueDate, and records REVISE_DEADLINE_FOR_CLASS for every pending late submission (D-I3-01).'
      - 'Expiry never creates a score; only REJECT_ZERO yields 0.'
    remaining: ['Covered by test:i3 (owner vs non-owner, stale revision, resubmission after revision, immutable history); a second revision in one run is not exercised.']
  i3-3-4-student-assignment-states:
    depends_on: i3-3-3-reject-or-revise-deadline
    decisions:
      - 'GET /assignments adds testStatus {status, dueAt, revision, extended, dueSoon, score}; GET /assignments/:id adds state with current submission and newest-first history.'
      - 'Statuses UPCOMING, DUE_SOON (24h window), OVERDUE_UNSUBMITTED, SUBMITTED, LATE_REVIEW_PENDING, REJECTED come from studentTestState, shared by all roles.'
    remaining: ['Browser acceptance of due-soon banner, late reason form, resubmission after extension.']
  i3-3-5-teacher-assignment-late-queue:
    depends_on: i3-3-3-reject-or-revise-deadline
    decisions:
      - 'GET classes/:id/assignments adds testSummary counts; GET classes/:id/assignments/:aid/test-status lists every original recipient with state, reasons and deadline history; GET classes/:id/late-queue lists current pending late submissions with permittedDecisions.'
      - 'Non-owner gets the existing CLASS_ACCESS_DENIED 403 before any student evidence is read.'
    remaining: ['Teacher progress/support boards still treat test assignments like labs; the new test-status view replaces them for tests.']
  i3-3-6-parent-overdue-notice:
    depends_on: i3-3-1-assign-test-due-date-recipient-snapshot
    decisions:
      - 'GET children/:studentId/assignment-notices derives OVERDUE notices (id assignment:student:revision) for approved, unrevoked links; GET children/:studentId/assignments/:aid returns read-only status and deadline. No answers, scores or actions.'
    remaining: ['Covered by test:i3 (pending parent and other child denied, extension clears the notice); revoked link not exercised.']
