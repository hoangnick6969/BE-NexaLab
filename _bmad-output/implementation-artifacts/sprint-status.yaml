  i3-3-1-assign-test-due-date-recipient-snapshot:
    depends_on: i2-2-2-create-test-content
    decisions:
      - 'Test assignment uses contentType "test", contentId = published TEST ClassResource of the same class, contentVersion = resource version; dueAt required (DUE_DATE_REQUIRED).'
      - 'Creation writes AssignmentDeadlineRevision 1 in the same transaction; Assignment.dueDate mirrors the latest revision.'
      - 'PUT on a test assignment accepts title only; target or due-date changes return 409 TEST_ASSIGNMENT_IMMUTABLE (deadline moves only via Story 3.3).'
      - 'Student detail strips correctOption and explanation before submission.'
    verification: 'BE lint, Vitest 157/157, Prisma validate, migration SQL equals prisma migrate diff; FE lint/build. API/DB and browser acceptance not run.'
    changed_files:
      - 'BE: prisma/schema.prisma'
      - 'BE: prisma/migrations/20261018150000_i3_assignment_deadline_revision/migration.sql'
      - 'BE: src/classes/assignment-test-contract.ts, src/classes/assignment-test-contract.test.ts'
      - 'BE: src/classes/assignments.controller.ts'
      - 'BE: src/learning/learning.controller.ts'
      - 'FE: src/features/classes/classes.tsx'
      - 'FE: src/features/learning/StudentAssignments.tsx, src/features/learning/AssignedLearning.tsx'
    remaining:
      - 'Apply migration to shared development (approval) and run API/DB acceptance: owner/non-owner, unpublished/draft/other-class test, missing due date, non-approved target (no partial targets), target vs non-target student read, idempotent retry.'
      - 'Teacher progress/support boards treat a test assignment like a lab (no attempts yet); proper test status belongs to Story 3.5.'
  i3-3-2-submit-assignment-late-reason:
    depends_on: i3-3-1-assign-test-due-date-recipient-snapshot
    decisions:
      - 'POST /assignments/:id/submissions {answers, lateReason?} with Idempotency-Key; server time decides timing (submittedAt <= dueAt is on time); late without reason -> 400 LATE_REASON_REQUIRED; incomplete/foreign answers -> 400 TEST_ANSWERS_INVALID.'
      - 'Every submission is an immutable AssignmentSubmission linked to its deadline revision and resource version; score is always computed but hidden while LATE_REVIEW_PENDING.'
      - 'Submission, rejection and deadline revision share the advisory lock assignment-deadline:<id>, so a late submission cannot slip past an extension.'
    remaining: ['Covered by test:i3 (late with/without reason, non-target/outsider, replay and key reuse); exact dueAt equality is unit-level only.']
  i3-3-3-reject-or-revise-deadline:
    depends_on: i3-3-2-submit-assignment-late-reason
    decisions:
      - 'POST classes/:id/assignments/:aid/late-submissions/:sid/reject {note?}: only the student current pending late submission (else 409 LATE_SUBMISSION_NOT_PENDING / LATE_SUBMISSION_SUPERSEDED); allowed after archive.'
      - 'POST classes/:id/assignments/:aid/deadline-revisions {dueAt, expectedRevision, note?, submissionId?}: ACTIVE only, stale revision -> 409 DEADLINE_REVISION_STALE, dueAt must be later than now and current -> 400 DUE_DATE_NOT_LATER; writes revision n+1, mirrors Assignment.dueDate, and records REVISE_DEADLINE_FOR_CLASS for every pending late submission (D-I3-01).'
      - 'Expiry never creates a score; only REJECT_ZERO yields 0.'
    remaining: ['Covered by test:i3 (owner vs non-owner, stale revision, resubmission after revision, immutable history); a second revision in one run is not exercised.']
  i3-3-4-student-assignment-states:
    depends_on: i3-3-3-reject-or-revise-deadline
    decisions:
      - 'GET /assignments adds testStatus {status, dueAt, revision, extended, dueSoon, score}; GET /assignments/:id adds state with current submission and newest-first history.'
      - 'Statuses UPCOMING, DUE_SOON (24h window), OVERDUE_UNSUBMITTED, SUBMITTED, LATE_REVIEW_PENDING, REJECTED come from studentTestState, shared by all roles.'
    remaining: ['Browser acceptance of due-soon banner, late reason form, resubmission after extension.']
  i3-3-5-teacher-assignment-late-queue:
    depends_on: i3-3-3-reject-or-revise-deadline
    decisions:
      - 'GET classes/:id/assignments adds testSummary counts; GET classes/:id/assignments/:aid/test-status lists every original recipient with state, reasons and deadline history; GET classes/:id/late-queue lists current pending late submissions with permittedDecisions.'
      - 'Non-owner gets the existing CLASS_ACCESS_DENIED 403 before any student evidence is read.'
    remaining: ['Teacher progress/support boards still treat test assignments like labs; the new test-status view replaces them for tests.']
  i3-3-6-parent-overdue-notice:
