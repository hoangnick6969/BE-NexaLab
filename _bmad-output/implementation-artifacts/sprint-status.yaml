  migration: '20261105120000_fk_indexes_and_schema_drift applied to shared Supabase 2026-11-05 (additive: StepProgress(studentId, stepId) declared but never created; FK indexes Attempt.labRunId/challengeId, TeacherGateOverride.stepId, BasicExerciseAttempt.stepId, FoundationalCourseLesson.lessonId, EbookAnnotation.subjectId). Indexes created by earlier migrations are now declared in schema.prisma. Tested on loopback: applies twice, migrate diff clean except p2-vid objects.'
