name: API checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexalab
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nexalab
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U nexalab" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab?schema=public
      # The job's own Postgres service on loopback; the package scripts refuse any other target.
      NEXALAB_ISOLATED_DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
      SEED_PASSWORD: IntegrationPassword2026!
      WEB_ORIGIN: http://localhost:5173
      # The integration scripts write rows directly and read them back at once; the short-TTL caches (perf review items
      # 10, 11) are covered by unit tests and turned off for the API they run against.
      SESSION_CACHE_TTL_MS: "0"
      CATALOG_CACHE_TTL_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      # DB integration suites only accept a loopback database named nexalab_pinning_test, and the
      # isolated-database guard requires every URL of a command to name that same database.
      - name: Prepare the isolated test database
        run: |
          PGPASSWORD=test_password psql -h localhost -U nexalab -d nexalab -c "CREATE DATABASE nexalab_pinning_test"
          npm run db:migrate
        env:
          NEXALAB_ISOLATED_DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          DIRECT_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          NEXALAB_PINNING_TEST_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
      # FL-07 fixtures only accept their own loopback database fl07_isolated, so that suite runs in
      # the next step instead of with the pinning database.
      - run: npm test -- --exclude src/modules/labs/interface/fl-07.integration.test.ts
        env:
          NEXALAB_ISOLATED_DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          DIRECT_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
          NEXALAB_PINNING_TEST_URL: postgresql://nexalab:test_password@localhost:5432/nexalab_pinning_test?schema=public
      - name: FL-07 integration on its own isolated database
        run: |
          PGPASSWORD=test_password psql -h localhost -U nexalab -d nexalab -c "CREATE DATABASE fl07_isolated"
          npm run db:migrate
          npx vitest run src/modules/labs/interface/fl-07.integration.test.ts
        env:
          NEXALAB_ISOLATED_DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/fl07_isolated?schema=public
          DATABASE_URL: postgresql://nexalab:test_password@localhost:5432/fl07_isolated?schema=public
          DIRECT_URL: postgresql://nexalab:test_password@localhost:5432/fl07_isolated?schema=public
          NEXALAB_FL07_TEST_URL: postgresql://nexalab:test_password@localhost:5432/fl07_isolated?schema=public
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
        env:
          DIRECT_URL: ${{ env.DATABASE_URL }}
          APP_ENV: test
          SEED_TARGET: localhost/nexalab
      - run: |
          npm start > /tmp/nexalab-api.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:4100/api/health && break || sleep 1; done
          npm run test:integration
