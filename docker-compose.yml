services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexalab
      POSTGRES_PASSWORD: nexalab_local
      POSTGRES_DB: nexalab
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexalab"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nexalab
      MINIO_ROOT_PASSWORD: nexalab_local_storage
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexalab:nexalab_local@postgres:5432/nexalab?schema=public
      # Migrations and seed use DIRECT_URL; override it so they never reach the database in .env.
      DIRECT_URL: postgresql://nexalab:nexalab_local@postgres:5432/nexalab?schema=public
      SEED_TARGET: postgres/nexalab
      SMTP_HOST: mailpit
      HOST: 0.0.0.0
    ports: ["127.0.0.1:4100:4100"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  minio_data:
